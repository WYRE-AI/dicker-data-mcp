services:
  # Gateway mode. Account code and access token arrive per request on
  # x-dickerdata-account-code and x-dickerdata-access-token. Do not set
  # DICKERDATA_ACCOUNT_CODE, DICKERDATA_ACCESS_TOKEN, or env_file here — that
  # would put static vendor credentials in the container. The project .env
  # is used only for Compose interpolation. For AUTH_MODE=env, pass those
  # variables on that process instead (see the README).
  dicker-data-mcp:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
